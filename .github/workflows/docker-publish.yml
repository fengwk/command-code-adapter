name: Docker Publish

on:
  push:
    branches:
      - docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: command-code-proxy
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 校验 Docker Hub 配置
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}" ]; then
            echo "::error::缺少 DOCKERHUB_USERNAME 或 DOCKER_USERNAME secret"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::缺少 DOCKERHUB_TOKEN 或 DOCKER_PASSWORD secret"
            exit 1
          fi
          if [ -z "${{ env.DOCKERHUB_NAMESPACE }}" ]; then
            echo "::error::缺少 Docker Hub 命名空间，请设置 DOCKERHUB_NAMESPACE variable 或用户名 secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=docker
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64